[build-system]
requires = ['hatchling>=1.26', "hatch-fancy-pypi-readme>=24.1", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "eyepiece"
description = "Plotting and animation primitives for astronomical imaging simulations: ax-first stateless figure functions, a multi-sink animation recorder, and styled figure saving."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["matplotlib>=3.11", "numpy>=2.1.2", "hwostyle>=1.7.0", "pillow>=11.3"]

[project.optional-dependencies]
hwo = ["hwoutils>=1.10"]
# mp4 export; supplies the ffmpeg binary when none is on PATH.
video = ["imageio-ffmpeg>=0.6"]
docs = ["sphinx>=8.0.2", "myst-nb>=1.2", "sphinx-book-theme>=1.1.4", "sphinx-autoapi>=3.3", "sphinx_autodoc_typehints>=2.4", "ipython>=8.18", "imageio-ffmpeg>=0.6", "colorspacious>=1.1.2", "physicaloptix>=2.3", "orbix>=2.0"]
test = [
    "pytest>=8.0",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.1.1",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "pytest-markdown-docs>=0.5.0",
    "imageio-ffmpeg>=0.6",
    "hypothesis>=6.112",
    "colorspacious>=1.1.2",
    "ipython>=8.18",
]
# Pillow 13 removes the Image.fromarray mode argument that manim 0.21 uses for
# every image mobject, so both Manim extras cap it until manim adapts.
manim = ["manim>=0.21,<0.22", "manimpango>=0.6,<1", "pillow>=11.3,<13"]
# The pyside6 extra supplies the Qt binding that `manim-slides present` needs.
slides = ["manim>=0.21,<0.22", "manimpango>=0.6,<1", "manim-slides[pyside6]>=5.7,<6", "pillow>=11.3,<13"]
# Speech for narrated clips; only eyepiece.narration.synth imports them, and
# only when a line has to be spoken. Kokoro pulls in torch and supports
# Python 3.10 to 3.12, so run it in an environment of its own. The pin is
# eyepiece.narration.KOKORO_VERSION, which enters every cache key.
narration = ["kokoro==0.9.4", "soundfile>=0.12.1"]
dev = ["pre-commit>=3.7.1"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/eyepiece"
Issues = "https://github.com/CoreySpohn/eyepiece/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/eyepiece/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["src/eyepiece"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # tol_colors constructs colormaps with Matplotlib's pending-deprecated set_bad.
    'ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:tol_colors',
    # pydub 0.25 uses non-raw regex strings that warn when Python compiles utils.py.
    'ignore:invalid escape sequence:SyntaxWarning:.*pydub[./]utils',
    # colorspacious 1.1.2 has a non-raw math docstring in comparison.py.
    'ignore:invalid escape sequence:SyntaxWarning:.*colorspacious[./]comparison',
    # pydub 0.25 imports stdlib audioop, deprecated in Python 3.12.
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:pydub.utils",
    # Manim 0.21 passes Image.fromarray(mode=), deprecated since Pillow 11.3 (wording changed in 12).
    "ignore:'mode' parameter.* deprecated and will be removed in Pillow 13.*:DeprecationWarning:manim.camera.camera",
]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "eyepiece"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["eyepiece"]
# Documentation and test tools are not runtime package requirements.
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.package_module_name_map]
pillow = ["PIL"]
ipython = ["IPython"]

[tool.deptry.per_rule_ignores]
# The slides extra supplies the external `manim-slides present` command.
DEP002 = ["manim-slides"]
# Optional features imported lazily with an ImportError message naming the
# extra: the meaning check (colorspacious) and notebook video display (IPython).
DEP004 = ["colorspacious", "IPython"]
